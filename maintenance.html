<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Технические работы</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <style>
    body {
      background-color: #3A6EA5;
      font-family: Tahoma, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .window {
      background-color: #ECE9D8;
      border: 2px solid #0055EA;
      width: 450px;
      padding: 2px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
    }
    .title-bar {
      background: linear-gradient(to right, #0058EE, #3793FF);
      color: #FFFFFF;
      font-weight: bold;
      padding: 4px 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .content-area { padding: 20px; text-align: center; }
    .win-btn {
      background: linear-gradient(to bottom, #FFFFFF, #ECE9D8);
      border: 1px solid #003C74;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="window">
  <div class="title-bar">
    <span>🚧 Внимание! Идут ремонтные работы</span>
    <span>[X]</span>
  </div>
  <div class="content-area">
    <h2 style="margin-top:0;">🚧 ИДУТ РЕМОНТНЫЕ РАБОТЫ 🚧</h2>
    <marquee scrollamount="4" style="background:#FFF000; color:#000; border:1px solid #000; padding:2px; font-weight:bold; margin: 10px 0;">
      ⚠️ Осторожно! Ведутся работы по модернизации Dial-Up Hub Board! ⚠️
    </marquee>
    <p style="font-size: 12px; font-weight: bold; margin-top: 15px;">
      К сожалению, у нас тут стройка — не мешайте нам!
    </p>
    <p style="font-size: 11px; color: #555;">
      Загляните позже, когда мы закончим допиливать скрипты.
    </p>
    <br>
    <button class="win-btn" onclick="location.reload()">🔄 Проверить статус</button>
  </div>
</div>

</body>
</html>
